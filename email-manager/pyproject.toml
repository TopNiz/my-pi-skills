[project]
name = "pi-email-manager"
version = "1.0.0"
description = "Gmail API transport, OAuth2 credential storage and invoice extraction for the pi email-manager skill"
requires-python = ">=3.10"
dependencies = [
    # Gmail API + OAuth2 transport
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    # macOS Keychain. Linux uses the system secret-tool and Windows uses a
    # plain file store, so keyring is not needed on those platforms.
    "keyring>=25.0; sys_platform == 'darwin'",
]

# The skill is a collection of scripts, not an installable package: nothing is
# built or installed for the project itself, only its dependencies.
[tool.uv]
package = false
