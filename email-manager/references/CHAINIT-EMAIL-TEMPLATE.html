<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{{SUBJECT}}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-shell { width: 100% !important; }
      .email-pad { padding-left: 22px !important; padding-right: 22px !important; }
      .brand-link { font-size: 12px !important; }
    }
  </style>
</head>
<!--
  Chain-IT version of the centered 600px miXYtes email layout.
  Brand source: chain-it-website/006-chainit-theme.css and assets/.
  Palette: deep bordeaux #4A0D1B, bordeaux #7A1A2E, ivory #F7F5F3,
  charcoal #1A1A1A, editorial copy #655B5E, editorial line #DCD3D3.
  Inter uses local installation with system and Arial fallbacks; no remote fonts.
  Embed chainit-web-logo.png in the HTML multipart/related branch with
  Content-ID: <chainit-web-logo>. Do not attach the logo as a regular attachment.
  Replace text placeholders with HTML-escaped values. CONTENT_HTML and
  SIGNATURE_HTML contain trusted HTML. LANG is en or fr.
  No navigation, phone button or invented social-media links.
-->
<body style="margin:0; padding:0; background:#F7F5F3; color:#1A1A1A; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <div aria-hidden="true" style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%; background:#F7F5F3;">
    <tr>
      <td align="center" style="padding:24px 10px;">
        <table role="presentation" class="email-shell" width="600" border="0" cellspacing="0" cellpadding="0" style="width:600px; max-width:600px; background:#FFFFFF; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="padding:22px 28px; background:#FFFFFF; border-top:4px solid #7A1A2E; border-bottom:1px solid #DCD3D3; border-radius:8px 8px 0 0;">
              <header>
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td width="175" valign="middle" style="width:175px;">
                      <a href="https://chain-it.com/" style="text-decoration:none;">
                        <img src="cid:chainit-web-logo" alt="Chain-IT" width="175" height="57" style="display:block; width:175px; height:57px; border:0;">
                      </a>
                    </td>
                    <td align="right" valign="middle" style="text-align:right;">
                      <a class="brand-link" href="https://chain-it.com/" style="color:#7A1A2E; text-decoration:none; font-size:14px; line-height:22px;">chain-it.com</a>
                    </td>
                  </tr>
                </table>
              </header>
            </td>
          </tr>
          <tr>
            <td class="email-pad" style="padding:32px 42px 24px; background:#FFFFFF;">
              <main>
                <h1 style="margin:0 0 24px; color:#4A0D1B; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:26px; line-height:34px; font-weight:600;">{{TITLE}}</h1>
                {{CONTENT_HTML}}
              </main>
            </td>
          </tr>
          <tr>
            <td class="email-pad" style="padding:0 42px; background:#FFFFFF;">
              <footer style="border-top:1px solid #DCD3D3; padding:22px 0 28px; color:#655B5E; font-size:14px; line-height:22px;">
                {{SIGNATURE_HTML}}
              </footer>
            </td>
          </tr>
          <tr>
            <td class="email-pad" style="padding:18px 42px; background:#4A0D1B; color:#F7F5F3; text-align:center; font-size:12px; line-height:20px; border-radius:0 0 8px 8px;">
              <p style="margin:0;">
                <a href="https://chain-it.com/" style="color:#F7F5F3; text-decoration:none; font-weight:600;">Chain-IT</a>
                <span style="color:#E8B4B0;">&nbsp;·&nbsp;</span>
                <span>{{FOOTER_TAGLINE}}</span>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
