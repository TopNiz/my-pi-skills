# Dedicated Nginx site for speedtest.codimeo.com.
# The speedtest rate-limit zone is configured in /etc/nginx/conf.d/speedtest-rate-limit.conf.
server {
    listen 80;
    server_name speedtest.codimeo.com;
    client_max_body_size 26m;
    client_body_timeout 120s;

    location / {
        limit_req zone=speedtest burst=30 nodelay;
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
    }
}
