# HTTP-only API bootstrap for speed-test.chain-it.com; add TLS before public use.
# The speedtest rate-limit zone is configured in /etc/nginx/conf.d/speedtest-rate-limit.conf.
server {
    listen 80;
    server_name speed-test.chain-it.com;
    # The API enforces exactly 1,000,000,000 bytes; Nginx uses binary units.
    client_max_body_size 1000m;
    client_body_timeout 1800s;
    gzip off;
    access_log off;
    error_log /dev/null crit;
    limit_req_status 429;

    location / {
        limit_req zone=speedtest burst=120 nodelay;
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
    }
}
