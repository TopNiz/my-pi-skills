catalog_version: 1
catalog_title: ESG template layout matching catalog
# Bare filename, resolved inside POWERPOINT_TEMPLATES_DIR (skill-local .env).
# The deck itself is not versioned: it is a third-party template that must not be
# redistributed. Only this catalog and the source_doc files below are committed.
template_file: ESG Innovation Sustainability PowerPoint Templates.pptx
slide_count: 48

# Default provenance when adapting a template pattern to a target slide.
provenance_profile: target_style_template_geometry
provenance_profiles:
  target_style_template_geometry:
    content:
      source: target_slide_specification
      policy: preserve_exactly
    typography:
      source: target_presentation
      policy: preserve_existing_font_and_text_treatment
    palette:
      source: target_presentation
      policy: preserve_existing_colors_unless_explicitly_overridden
    background:
      source: target_slide_or_target_presentation
      policy: preserve_existing_background
    geometry:
      source: template_slide
      policy: import_or_adapt_graphical_arrangement_only
    editable_vectors:
      source: template_slide
      policy: import_shapes_and_editable_vector_graphics_only
    template_text:
      source: template_slide
      policy: do_not_import
    template_logo:
      source: template_slide
      policy: do_not_import
    template_photography:
      source: template_slide
      policy: explicit_opt_in_only
    additional_assets:
      source: target_assets_or_explicit_request
      policy: add_only_when_required_or_requested

matching_guidance:
  primary_fields:
    - semantic_types
    - item_count
    - flow
    - hierarchy
    - text_density
    - geometry
  selection_order:
    - match semantic_types
    - match item_count when relevant
    - match flow
    - match hierarchy
    - check text_density
    - read source_doc before editing
  confidence_values:
    high: Direct match for the slide's communication purpose and structure.
    medium: Usable adaptation, but the visual metaphor or item count differs.
    low: Reusable only when the narrative purpose is deliberately changed.

