[project]
name = "pi-powerpoint"
version = "1.0.0"
description = "Layout-preserving PowerPoint editing and template-driven deck building for the pi powerpoint skill"
requires-python = ">=3.10"
dependencies = [
    # Deck reading/writing, layout and placeholder inspection, template builds.
    # lxml (used by the direct-formatting repair snippet) arrives with it.
    "python-pptx>=1.0",
]

# The skill is a collection of scripts, not an installable package: nothing is
# built or installed for the project itself, only its dependencies.
[tool.uv]
package = false
